{% extends "base.html" %}

{% block content %}

<h1>Register</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label for="username" class="form-label">
            Username
        </label>

        <input
            type="text"
            name="username"
            class="form-control"
            id="username"
            placeholder="Enter your username"
            required
        >
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">
            Email address
        </label>

        <input
            type="email"
            name="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">
            Password
        </label>

        <input
            type="password"
            name="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <div class="mb-3">
        <label for="confirm_password" class="form-label">
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            class="form-control"
            id="confirm_password"
            placeholder="Confirm your password"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Register
    </button>

</form>

<p class="mt-3">
    Already have an account?
    <a href="{% url 'Login' %}">Login</a>
</p>

{% endblock %}
