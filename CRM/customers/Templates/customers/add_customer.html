{% extends "base.html" %}

{% block content %}

<h1>Add Customer</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="button">
        Save Customer
    </button>

    <a href="{% url 'customer_list' %}" class="button">
        Cancel
    </a>

</form>

{% endblock %}
