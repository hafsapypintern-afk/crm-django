{% extends "base.html" %}

{% block content %}

<h1>Update Customer</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="button">
        Update Customer
    </button>

    <a href="{% url 'customer_detail' customer.id %}" class="button">
        Cancel
    </a>

</form>

{% endblock %}
