{% extends "base.html" %}

{% block content %}

<h1>Delete Order</h1>

<p>
    Are you sure you want to delete Order #{{ order.id }}?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

</form>

<a href="{% url 'order_detail' order.id %}">
    Cancel
</a>

{% endblock %}
